# Backend server: API + Caddy (HTTPS in front of the API). The storefront runs on
# Cloudflare Pages; the database is Neon (DATABASE_URL in backend/.env).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# deploy/.env    → API_DOMAIN (used by this file only)
# backend/.env   → the API's own settings incl. DATABASE_URL (see backend/.env.example)

name: zhimart

services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      BIND_ADDR: 0.0.0.0:8080
      APP_ENV: production
      # Only Caddy (fixed address below) may set X-Forwarded-For.
      TRUSTED_PROXIES: 172.28.0.10/32
    networks: [internal]
    # No ports: only Caddy reaches the API.

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks:
      internal:
        ipv4_address: 172.28.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
