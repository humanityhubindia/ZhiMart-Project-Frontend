# Host nginx site for the Zhi-Mart API (used with deploy/docker-compose.host-nginx.yml).
#   sudo cp deploy/nginx/api.zhimart.in.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.zhimart.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.zhimart.in      # adds the HTTPS (443) server block
server {
    listen 80;
    listen [::]:80;
    server_name api.zhimart.in;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
