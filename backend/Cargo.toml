[package]
name = "zhimart-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "zhimart-backend"
path = "src/main.rs"

[dependencies]
# HTTP stack
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path"] }
axum-extra = { version = "0.10.3", default-features = false, features = ["cookie"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6.11", features = ["cors", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace", "catch-panic", "propagate-header", "util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "chrono", "ipnetwork"] }

# Security / crypto
argon2 = { version = "0.5.3", features = ["std"] }
jsonwebtoken = "9.3.1"
rand = "0.8.5"
sha2 = "0.10.9"
hmac = "0.12.1"
subtle = "2.6.1"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1.8"
base64 = "0.22.1"
governor = "0.10"

# Payments (Cashfree PG REST API) + Google Sheets API
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Email (AWS SES v2)
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-sdk-sesv2 = { version = "1.130", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }

# Serialization / types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
time = "0.3"
ipnetwork = "0.20"

# Ops
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15.7"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.4"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
